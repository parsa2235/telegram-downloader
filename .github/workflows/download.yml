name: Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: 'لینک پست تلگرام'
        required: true
  repository_dispatch:
    types: [download_telegram]

permissions:
  contents: write

jobs:
  download_and_release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyrogram tgcrypto requests

    - name: Download File from Telegram
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        TELEGRAM_LINK: ${{ github.event.inputs.telegram_link || github.event.client_payload.telegram_link }}
      run: |
        python downloader.py

    - name: Upload to GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: release-${{ github.run_id }}
        name: Telegram Download ${{ github.run_id }}
        files: |
          $(cat downloaded_file.txt)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify User via Telegram
      if: success()
      run: |
        FILE_NAME=$(basename $(cat downloaded_file.txt))
        RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/release-${{ github.run_id }}"
        
        TEXT="🎉 **آپلود با موفقیت انجام شد!**%0A%0A📁 فایل: \`${FILE_NAME}\`%0A🔗 **لینک دانلود ریلیز:**%0A${RELEASE_URL}"
        
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.CHAT_ID }}" \
          -d "text=${TEXT}" \
          -d "parse_mode=Markdown"
