name: Telegram Batch Downloader

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'Telegram Post Links (one per line or range e.g., 100-120)'
        required: true
        type: string
      chat_id:
        description: 'Chat ID or Username (e.g., channel_name or -100123456789)'
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: 
      group: telegram-download-queue
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyrogram tgcrypto requests aiohttp
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Configure Git User
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"

      - name: Run Parallel Downloader
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          INPUT_LINKS: ${{ inputs.links }}
          INPUT_CHAT_ID: ${{ inputs.chat_id }}
        run: python src/downloader.py

      - name: Commit and Push History
        run: |
          git add data/history.json
          git commit -m "Update history: Batch download completed" || echo "No changes to commit"
          git push origin main
