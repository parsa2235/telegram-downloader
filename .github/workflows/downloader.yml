name: Telegram Batch Downloader

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'Telegram Post Links (one per line) OR Range (e.g., 100-120)'
        required: true
        type: string
      chat_id:
        description: 'Chat ID or Username (Optional if links contain channel name)'
        required: false
        type: string
        default: ''

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2 # Download 2 files simultaneously

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # Use GitHub PAT for authentication
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyrogram tgcrypto requests aiohttp
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Configure Git User
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"

      - name: Run Parallel Downloader
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          INPUT_LINKS: ${{ inputs.links }}
          INPUT_CHAT_ID: ${{ inputs.chat_id }}
        run: python src/downloader.py

      - name: Commit and Push History
        run: |
          git add data/history.json
          git commit -m "Update history: Batch download completed [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
